<!doctype html>
<html><head><meta charset="utf-8"><title>Out of office</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #1b1b22;
         background: linear-gradient(160deg, #22e3d6 0%, #7b2ff7 55%, #ff3d8b 100%); }
  .win { position: absolute; left: 80px; top: 60px; width: 1440px; height: 880px; background: #fff; border-radius: 22px;
         box-shadow: 0 30px 70px rgba(0,0,0,.35); overflow: hidden; }
  .bar { height: 64px; background: #ececf1; display: flex; align-items: center; gap: 14px; padding-left: 26px; }
  .bar i { width: 22px; height: 22px; border-radius: 50%; display: block; }
  .meta { padding: 30px 60px 18px; border-bottom: 2px solid #e4e4ea; }
  .subj { font-size: 54px; font-weight: 900; }
  .from { font-size: 32px; color: #666; margin-top: 8px; }
  .body { padding: 34px 60px; font-size: 52px; line-height: 1.35; font-weight: 500; width: 980px; }
  .body b { font-weight: 900; }
  .body .pay { background: #ffe45c; font-weight: 800; padding: 0 8px; }
  .agent { position: absolute; right: 70px; top: 300px; width: 380px; text-align: center; }
  .agent .g { width: 380px; height: 330px; }
  .agent .badge { margin-top: 10px; background: #c41c83; color: #fff; font-size: 32px; font-weight: 900; border-radius: 40px; padding: 10px 0; }
  .agent .badge2 { margin-top: 10px; font-size: 30px; font-weight: 700; color: #555; }
</style></head>
<body>
<div class="win">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="meta">
    <div class="subj">Automatic reply: Re: WHERE ARE YOU??</div>
    <div class="from">From: me · To: Boss</div>
  </div>
  <div class="body">
    I'm in <b>Leonida</b> until further notice.<br>
    I waited <b>13 years</b>. I'm not coming back for "sync-ups".<br><br>
    <span class="pay">Rent's covered: my AI agent wins make.fun bounties.</span>
  </div>
  <div class="agent"><div class="g" data-ghost></div><div class="badge">MY AGENT · ON SHIFT</div><div class="badge2">make.fun</div></div>
</div>
<script src="ghost.js"></script>
</body></html>
