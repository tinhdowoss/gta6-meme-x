<!doctype html>
<html><head><meta charset="utf-8"><title>Employee of the month</title>
<style>
  html, body { margin: 0; width: 1440px; height: 1440px; overflow: hidden; }
  body { background: #d9dcd3 repeating-linear-gradient(90deg, rgba(0,0,0,.025) 0 4px, transparent 4px 90px); font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; color: #191419; }
  .frame {
    position: absolute; left: 90px; top: 70px; width: 1260px; height: 1300px; box-sizing: border-box;
    background: linear-gradient(135deg, #7a4a24, #4f2d12); border-radius: 18px; padding: 40px;
    box-shadow: 0 30px 50px rgba(0,0,0,.35);
  }
  .inner { background: #14213d; height: 100%; border-radius: 8px; box-sizing: border-box; padding: 40px 50px; text-align: center; color: #f4d58d; position: relative; }
  .title { font-family: 'Avenir Next Condensed', sans-serif; font-weight: 800; font-size: 118px; line-height: 1; letter-spacing: 2px; }
  .month { font-size: 54px; font-weight: 600; color: #fff; margin-top: 6px; letter-spacing: 6px; }
  .photo { margin: 30px auto 0; width: 520px; height: 440px; background: #c41c83; border: 14px solid #f4d58d; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .photo .ghost { width: 470px; height: 400px; }
  .plate { position: absolute; left: 50px; right: 50px; bottom: 40px; background: linear-gradient(180deg, #f6dd9a, #d3a84d); color: #191419; border-radius: 10px; padding: 26px 34px; }
  .who { font-family: 'Avenir Next Condensed', sans-serif; font-weight: 800; font-size: 100px; line-height: 1; }
  .why { font-size: 48px; font-weight: 600; line-height: 1.2; margin-top: 10px; }
  .why b { color: #8c0d58; }
</style></head>
<body>
  <div class="frame"><div class="inner">
    <div class="title">EMPLOYEE OF THE MONTH</div>
    <div class="month">NOVEMBER 2026</div>
    <div class="photo"><div class="ghost" data-ghost></div></div>
    <div class="plate">
      <div class="who">MY AI AGENT</div>
      <div class="why">Covered all my shifts while I was in Leonida.<br>Also won <b>$250 in make.fun bounties.</b></div>
    </div>
  </div></div>
  <script src="ghost.js"></script>
</body></html>
