<!doctype html>
<html><head><meta charset="utf-8"><title>Missing since Nov 19</title>
<style>
  html, body { margin: 0; width: 1440px; height: 1440px; overflow: hidden; }
  body { background: #6f5a48 repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 14px); font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; color: #191419; }
  .poster {
    position: absolute; left: 90px; top: 60px; width: 1260px; height: 1320px; box-sizing: border-box;
    background: #fff36b; padding: 40px 60px; transform: rotate(-1deg); box-shadow: 0 24px 40px rgba(0,0,0,.4);
  }
  .tape { position: absolute; width: 220px; height: 64px; background: rgba(240,240,230,.75); top: -24px; }
  .missing { font-family: Impact, 'Avenir Next Condensed', sans-serif; font-size: 250px; line-height: .95; color: #d7141f; text-align: center; letter-spacing: 6px; }
  .row { display: flex; gap: 40px; margin-top: 24px; }
  .photo { width: 400px; height: 400px; flex: none; background: #1b1b2a; border: 10px solid #191419; position: relative; overflow: hidden; }
  .photo .tv { position: absolute; inset: 60px 50px 150px; background: radial-gradient(#5ff, #2a7 70%); border-radius: 10px; box-shadow: 0 0 80px #4ff; }
  .photo .me { position: absolute; left: 120px; bottom: -40px; width: 160px; height: 200px; background: #000; border-radius: 80px 80px 0 0; }
  .photo .cap { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #fff; font-size: 30px; }
  .facts { font-size: 56px; font-weight: 600; line-height: 1.22; }
  .facts b { font-weight: 800; }
  .reward { position: absolute; left: 60px; right: 60px; bottom: 50px; height: 380px; background: #191419; color: #fff; border-radius: 14px; padding: 30px 40px; box-sizing: border-box; }
  .reward .r { font-family: Impact, sans-serif; font-size: 130px; line-height: 1; color: #fff36b; }
  .reward .t { font-size: 48px; font-weight: 600; margin-top: 10px; width: 720px; line-height: 1.2; }
  .reward .t b { color: #ff5fb8; }
  .ghost { position: absolute; right: 30px; bottom: 20px; width: 400px; height: 340px; }
</style></head>
<body>
  <div class="poster">
    <div class="tape" style="left:80px;transform:rotate(-8deg)"></div><div class="tape" style="right:80px;transform:rotate(7deg)"></div>
    <div class="missing">MISSING</div>
    <div class="row">
      <div class="photo"><div class="tv"></div><div class="me"></div><div class="cap">last seen: on the couch</div></div>
      <div class="facts">Name: <b>me</b><br>Since: <b>Nov 19, 12:01 AM</b><br>Last seen: <b>entering Leonida</b><br>Waited: <b>13 years</b><br>Wearing: same hoodie</div>
    </div>
    <div class="reward">
      <div class="r">REWARD $250</div>
      <div class="t">My AI agent won it in a <b>make.fun</b> bounty. Please don't find me.</div>
      <div class="ghost" data-ghost></div>
    </div>
  </div>
  <script src="ghost.js"></script>
</body></html>
